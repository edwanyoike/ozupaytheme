<!-- wp:html -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');

:root{
  --og:#00A651;--og-dk:#00924A;--og-lt:#00C45F;
  --og-bg:#ECFDF3;--og-border:#BBF7D0;
  --navy:#0F172A;--slate-800:#1E293B;--slate-700:#334155;
  --slate-600:#475569;--slate-500:#64748B;--slate-400:#94A3B8;
  --slate-200:#E4DECF;--slate-100:#EFEBE0;--slate-50:#F7F5EF;
}

.ofp{font-family:'Public Sans',system-ui,-apple-system,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased;}
.ofp *{box-sizing:border-box;}
.ofp h1,.ofp h2,.ofp h3{font-family:'Space Grotesk',system-ui,sans-serif;}
.ofp-mono{font-family:'JetBrains Mono','Fira Code',monospace;}

/* Hero — mobile-first: narrow padding base, wider on tablet+ */
.ofp-hero{background:#fff;border-bottom:1px solid var(--slate-200);padding:40px 20px 36px;}
@media(min-width:640px){.ofp-hero{padding:64px 32px 56px;}}
.ofp-hero-inner{max-width:1200px;margin:0 auto;}
.ofp-hero h1{margin:16px 0 12px;font-size:clamp(30px,4vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1.08;color:var(--navy);}
.ofp-hero p{margin:0;font-size:17px;line-height:1.65;color:var(--slate-600);max-width:520px;}
.ofp-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--slate-500);text-decoration:none;margin-bottom:8px;}
.ofp-back:hover{color:var(--og);}
.ofp-back svg{transition:transform .15s;}
.ofp-back:hover svg{transform:translateX(-2px);}

/* Section headers — mobile-first: narrow padding base, wider on tablet+ */
.ofp-section{padding:40px 20px;}
@media(min-width:640px){.ofp-section{padding:64px 32px;}}
.ofp-section-inner{max-width:1200px;margin:0 auto;}
.ofp-section--free{background:var(--slate-50);border-bottom:1px solid var(--slate-200);}
.ofp-section--pro{background:#fff;border-bottom:1px solid var(--slate-200);}
.ofp-section-label{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;}
.ofp-section--free .ofp-section-label{color:var(--slate-500);}
.ofp-section--pro .ofp-section-label{color:var(--og);}
.ofp-section h2{margin:0 0 36px;font-size:clamp(22px,2.5vw,30px);font-weight:700;letter-spacing:-.025em;color:var(--navy);}

/* Grid — mobile-first: 1 column base, expand on wider screens */
.ofp-grid{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:560px){.ofp-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:900px){.ofp-grid{grid-template-columns:repeat(3,1fr);}}

/* Cards */
.ofp-card{background:#fff;border:1px solid var(--slate-200);border-radius:14px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,box-shadow .15s;}
.ofp-card:hover{border-color:var(--og);box-shadow:0 8px 24px -10px rgba(0,166,81,.18);}
.ofp-section--free .ofp-card{background:var(--slate-50);}
.ofp-section--free .ofp-card:hover{background:#fff;}
.ofp-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.ofp-card-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;}
.ofp-section--free .ofp-card-icon{background:var(--slate-100);}
.ofp-section--pro .ofp-card-icon{background:var(--navy);}
.ofp-section--free .ofp-card-icon svg{stroke:var(--slate-500);}
.ofp-section--pro .ofp-card-icon svg{stroke:#4ADE80;}
.ofp-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:5px;flex:none;white-space:nowrap;}
.ofp-badge--free{background:var(--slate-100);color:var(--slate-500);}
.ofp-badge--pro{background:var(--og);color:#fff;}
.ofp-card h3{margin:0;font-size:15px;font-weight:700;color:var(--navy);line-height:1.25;font-family:'Space Grotesk',system-ui,sans-serif;}
.ofp-card p{margin:0;font-size:13.5px;line-height:1.55;color:var(--slate-500);flex:1;}
.ofp-readmore{background:none;border:none;padding:8px 0;cursor:pointer;font-size:13px;font-weight:600;color:var(--og);font-family:'Public Sans',system-ui,sans-serif;display:inline-flex;align-items:center;gap:4px;margin-top:0;transition:gap .15s;min-height:44px;}
.ofp-readmore:hover{gap:7px;}

/* Modal backdrop — mobile-first: bottom sheet base, centered dialog on tablet+ */
.ofp-modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.68);z-index:9000;display:flex;align-items:flex-end;justify-content:center;padding:0;}
.ofp-modal-backdrop[hidden]{display:none;}
@media(min-width:560px){
  .ofp-modal-backdrop{padding:20px;align-items:center;}
  .ofp-modal-sheet{border-radius:18px;max-height:90vh;}
  .ofp-modal-head{padding:24px 24px 0;padding-bottom:16px;}
  .ofp-modal-body{padding:20px 24px 28px;}
}

/* Modal sheet */
.ofp-modal-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;box-shadow:0 40px 80px -24px rgba(15,23,42,.45);display:flex;flex-direction:column;}
.ofp-modal-head{padding:20px 20px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;position:sticky;top:0;background:#fff;padding-bottom:14px;border-bottom:1px solid var(--slate-100);}
.ofp-modal-head-left{display:flex;flex-direction:column;gap:8px;}
.ofp-modal-head-left h2{margin:0;font-size:20px;font-weight:700;color:var(--navy);font-family:'Space Grotesk',system-ui,sans-serif;}
.ofp-modal-close{background:none;border:none;cursor:pointer;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--slate-400);transition:background .15s,color .15s;flex:none;margin-top:-6px;margin-right:-6px;}
.ofp-modal-close:hover{background:var(--slate-100);color:var(--navy);}
.ofp-modal-body{padding:16px 20px 32px;font-size:15px;line-height:1.7;color:var(--slate-700);}
.ofp-modal-body p{margin:0 0 14px;}
.ofp-modal-body p:last-child{margin-bottom:0;}
.ofp-modal-body ul{margin:0 0 14px;padding-left:20px;display:flex;flex-direction:column;gap:6px;}
.ofp-modal-body li{line-height:1.55;}
</style>

<div class="ofp">

<!-- Hero -->
<section class="ofp-hero">
<div class="ofp-hero-inner">
  <a href="/" class="ofp-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Back to overview
  </a>
  <div class="ofp-mono" style="color:var(--og);margin-bottom:0;">OzuPay for WooCommerce</div>
  <h1>All features</h1>
  <p>Everything OzuPay does — from the basics available in the free plugin to the full Pro feature set.</p>
</div>
</section>

<!-- Free features -->
<section class="ofp-section ofp-section--free">
<div class="ofp-section-inner">
  <div class="ofp-section-label">Free</div>
  <h2>Available in the free plugin</h2>
  <div class="ofp-grid" id="ofp-grid-free"></div>
</div>
</section>

<!-- Pro features -->
<section class="ofp-section ofp-section--pro">
<div class="ofp-section-inner">
  <div class="ofp-section-label">Pro</div>
  <h2>Available in Pro</h2>
  <div class="ofp-grid" id="ofp-grid-pro"></div>
</div>
</section>

</div><!-- /ofp -->

<!-- Modal -->
<div class="ofp-modal-backdrop" id="ofp-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="ofp-modal-title">
  <div class="ofp-modal-sheet">
    <div class="ofp-modal-head">
      <div class="ofp-modal-head-left">
        <h2 id="ofp-modal-title"></h2>
        <span class="ofp-badge" id="ofp-modal-badge"></span>
      </div>
      <button class="ofp-modal-close" id="ofp-modal-close" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="ofp-modal-body" id="ofp-modal-body"></div>
  </div>
</div>

  var freeFeatures = [
    {
      id: 'stk',
      icon: icons.phone,
      name: 'STK Push payments',
      summary: 'Customers pay directly from their Safaricom phone — no card, no redirect, no leaving your store.',
      detail: '<p>When a customer places an order and selects M-Pesa, OzuPay sends an STK Push prompt to their phone via the Safaricom Daraja 2.0 API. The customer enters their M-Pesa PIN and the payment clears. WooCommerce marks the order paid automatically when the Daraja callback arrives — no manual checking or reconciliation.</p><p>The STK Push goes to whichever number the customer enters at checkout, not just their registered line. If the prompt does not arrive, customers can retry up to twice from the order page or fall back to paying manually via Paybill.</p>',

      id: 'paybill',
      icon: icons.store,

      summary: 'Accept payments to your existing Paybill or Buy Goods number with automatic order confirmation.',
      detail: '<p>OzuPay works with both Paybill and Till (Buy Goods) shortcode types. Configure your shortcode once in the plugin settings and OzuPay handles the rest.</p><p>For Paybill, an account reference is displayed at checkout so customers can pay manually and submit their transaction code if needed. For Till, customers use the Buy Goods flow. Both shortcode types support STK Push, the Daraja callback, and the manual transaction code fallback.</p>',

    {
      id: 'ip-security',
      icon: icons.shield,

      name: 'Sandbox & production environments',
      summary: 'Test against the Daraja sandbox before going live — switch with a single dropdown.',

      detail: '<p>If the STK Push does not arrive — poor signal, wrong number, Daraja delay — customers can pay manually via Paybill or Till and enter their M-Pesa confirmation SMS code directly on the order page. The code is stored on the order and the order moves to on-hold for admin review.</p><p>Duplicate code detection runs across all orders so the same M-Pesa reference cannot be used to pay two orders. Retries are rate-limited to prevent abuse.</p>',

  var proFeatures = [
    {
      id: 'cod-deposit',
      icon: icons.truck,

    {
      id: 'notifications',

      detail: '<p>OzuPay sends an email to configured recipients when an STK Push request fails at the Daraja level, when a callback arrives but cannot be processed, or when a payment is left unconfirmed beyond the expected timeout.</p><p>It also alerts you when a C2B (Paybill/Till) payment arrives that can\'t be automatically matched to an order, and when one is matched and confirmed automatically with no cashier or admin action needed.</p><p>An Alert Types checklist lets you choose exactly which of these events send an email, so you\'re not stuck with an all-or-nothing toggle. Alerts include the order number, error details from the Daraja response, and a direct link to the WooCommerce order screen so you can act immediately. Recipient addresses are configurable, helping you spot payment issues before a customer reports one.</p>',

  function buildCard( f, tier ) {
    var el = document.createElement( 'div' );
    el.className = 'ofp-card';
    el.dataset.id = f.id;
    el.innerHTML =
      '<div class="ofp-card-top">' +
        '<div class="ofp-card-icon">' + f.icon + '</div>' +
        '<span class="ofp-badge ofp-badge--' + tier.toLowerCase() + '">' + tier + '</span>' +
      '</div>' +
      '<h3>' + f.name + '</h3>' +
      '<p>' + f.summary + '</p>' +
      '<button class="ofp-readmore" type="button">' +
        'Read more' +
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>' +
      '</button>';
    return el;
  }

  document.addEventListener( 'DOMContentLoaded', function () {
    var freeGrid = document.getElementById( 'ofp-grid-free' );
    var proGrid  = document.getElementById( 'ofp-grid-pro' );

    freeFeatures.forEach( function (f) { freeGrid.appendChild( buildCard( f, FREE ) ); } );
    proFeatures.forEach(  function (f) { proGrid.appendChild(  buildCard( f, PRO  ) ); } );

    // Modal
    var backdrop  = document.getElementById( 'ofp-backdrop' );
    var modalTitle = document.getElementById( 'ofp-modal-title' );
    var modalBadge = document.getElementById( 'ofp-modal-badge' );
    var modalBody  = document.getElementById( 'ofp-modal-body' );
    var closeBtn   = document.getElementById( 'ofp-modal-close' );

    function allFeatures() { return freeFeatures.concat( proFeatures ); }

    function openModal( id, updateHash ) {
      var f    = allFeatures().find( function (x) { return x.id === id; } );
      var tier = freeFeatures.find( function (x) { return x.id === id; } ) ? FREE : PRO;
      if ( ! f ) return;
      modalTitle.textContent = f.name;
      modalBadge.textContent = tier;
      modalBadge.className   = 'ofp-badge ofp-badge--' + tier.toLowerCase();
      modalBody.innerHTML    = f.detail;
      backdrop.removeAttribute( 'hidden' );
      document.body.style.overflow = 'hidden';
      closeBtn.focus();
      if ( updateHash !== false && window.location.hash !== '#' + id ) {
        history.replaceState( null, '', '#' + id );
      }
    }

    function closeModal() {
      backdrop.setAttribute( 'hidden', '' );
      document.body.style.overflow = '';
      if ( window.location.hash ) {
        history.replaceState( null, '', window.location.pathname + window.location.search );
      }
    }

    document.addEventListener( 'click', function (e) {
      var btn = e.target.closest( '.ofp-readmore' );
      if ( btn ) {
        openModal( btn.closest( '.ofp-card' ).dataset.id );
        return;
      }
      if ( e.target === backdrop ) {
        closeModal();
      }
    } );

    closeBtn.addEventListener( 'click', closeModal );

    document.addEventListener( 'keydown', function (e) {
      if ( e.key === 'Escape' && ! backdrop.hasAttribute( 'hidden' ) ) {
        closeModal();
      }
    } );

    // Deep-link support: /features/#qr opens that feature's modal directly,
    // e.g. from the plugin's admin "Read more" links.
    if ( window.location.hash ) {
      openModal( window.location.hash.slice( 1 ), false );
    }
    window.addEventListener( 'hashchange', function () {
      if ( window.location.hash ) {
        openModal( window.location.hash.slice( 1 ), false );
      }
    } );
  } );
}());
</script>
